name: Release

on:
  push:
    paths:
      - ".changeset/**"
      - "packages/**"
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    # prevents this action from running on forks
    if: github.repository == 'resolid/framework'
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Cache Turborepo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Setup PNPM
        uses: pnpm/setup@v3
        with:
          node-version-file: false
          runtime: node@lts
          cache: true

      - name: Build Packages
        run: pnpm run build:packages

      - name: Test Packages
        run: pnpm run test:packages

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v2
        with:
          pr-title: "chore: release package(s)"
          commit-message: "chore: release package(s)"
          publish-script: pnpm changeset publish
