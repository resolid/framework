name: Deploy

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build:
    # prevents this action from running on forks
    if: github.repository == 'resolid/framework'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: PNPM Setup
        uses: pnpm/setup@v3
        with:
          node-version-file: false
          runtime: node@lts
          cache: true

      - name: Build Website
        run: pnpm run build

      - name: Deploy Website
        uses: easingthemes/ssh-deploy@main
        with:
          REMOTE_HOST: ${{ secrets.HOST }}
          REMOTE_PORT: ${{ secrets.PORT }}
          REMOTE_USER: ${{ secrets.USERNAME }}
          SSH_PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          ARGS: "-avzr --delete"
          SOURCE: "website/build/"
          TARGET: "/home/websites/resolid/build/"
          SCRIPT_AFTER: pm0 restart resolid-site resolid-admin
          SCRIPT_AFTER_REQUIRED: true
