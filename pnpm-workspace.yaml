packages:
  - packages/*
  - website
engineStrict: true
lockfile:
  format: v13
overrides:
  react: ^19.3.1
  react-dom: ^19.3.1
  safer-buffer: npm:@nolyfill/safer-buffer@^1
allowBuilds:
  "@tailwindcss/oxide": true
  esbuild: true
  lefthook: true
minimumReleaseAge: 600
minimumReleaseAgeExclude:
  - "@resolid/*"
